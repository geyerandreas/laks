name: Publish crates.io

on:
  workflow_dispatch:

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build workspace in release mode
        run: cargo build --workspace --locked --verbose --release

      - name: Run workspace tests
        run: cargo test --workspace --locked --verbose

      - name: Publish workspace to crates.io
        run: cargo publish --workspace --locked --verbose
